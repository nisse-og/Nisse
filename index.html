<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nisse Study</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .timer {
            text-align: center;
        }

        .timer-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #timer {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 15px;
        }

        .start {
            background: #222;
            color: white;
        }

        .reset {
            background: #ddd;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat {
            background: #f2f2f2;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-title {
            font-size: 14px;
            opacity: 0.7;
        }

        .stat-value {
            font-size: 25px;
            font-weight: bold;
            margin-top: 5px;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
        }

        .add {
            background: #222;
            color: white;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 18px 0 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 9px;
            background: #f2f2f2;
            border-radius: 10px;
        }

        li span {
            flex: 1;
        }

        .completed span {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .delete {
            background: #ddd;
        }

        .day {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
        }

        .day:last-child {
            border-bottom: none;
        }

        .week-total {
            text-align: center;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        @media (max-width: 400px) {
            #timer {
                font-size: 40px;
            }

            .input-area {
                flex-direction: column;
            }

            .add {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Nisse Study</h1>

    <!-- TIMER -->

    <div class="card
