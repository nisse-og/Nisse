<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nisse Study</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background: #f3f3f3;

            padding: 25px 15px;

        }


        .container {

            width: 100%;

            max-width: 550px;

            margin: auto;

        }


        h1 {

            text-align: center;

            margin-bottom: 25px;

        }


        h2 {

            margin-top: 0;

        }


        .card {

            background: white;

            border-radius: 16px;

            padding: 20px;

            margin-bottom: 18px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);

        }


        /* =========================
           TIMER
        ========================= */


        .timer {

            text-align: center;

        }


        .timer-title {

            font-size: 18px;

            margin-bottom: 12px;

            font-weight: bold;

        }


        .timer-status {

            font-size: 13px;

            opacity: 0.6;

            margin-bottom: 8px;

        }


        select {

            width: 100%;

            padding: 12px;

            border:
                1px solid #ccc;

            border-radius: 9px;

            font-size: 16px;

            background: white;

            margin-bottom: 12px;

        }


        #timer {

            font-size: 48px;

            font-weight: bold;

            margin: 15px 0;

            letter-spacing: 1px;

        }


        .buttons {

            display: flex;

            justify-content: center;

            gap: 10px;

        }


        button {

            border: none;

            border-radius: 9px;

            padding: 11px 16px;

            cursor: pointer;

            font-size: 15px;

        }


        button:active {

            transform: scale(0.97);

        }


        .start {

            background: #222;

            color: white;

        }


        .reset {

            background: #ddd;

            color: #222;

        }


        /* =========================
           STATS
        ========================= */


        .stats {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

        }


        .stat {

            background: #f2f2f2;

            border-radius: 12px;

            padding: 15px;

            text-align: center;

        }


        .stat-title {

            font-size: 14px;

            opacity: 0.7;

        }


        .stat-value {

            font-size: 25px;

            font-weight: bold;

            margin-top: 5px;

        }


        /* =========================
           STUDY ROWS
        ========================= */


        .study-row {

            display: flex;

            justify-content:
                space-between;

            padding: 10px 0;

            border-bottom:
                1px solid #eee;

        }


        .study-row:last-child {

            border-bottom: none;

        }


        /* =========================
           INPUTS
        ========================= */


        .input-area {

            display: flex;

            gap: 8px;

        }


        input[type="text"] {

            flex: 1;

            padding: 12px;

            border:
                1px solid #ccc;

            border-radius: 9px;

            font-size: 16px;

        }


        .add {

            background: #222;

            color: white;

        }


        /* =========================
           TASKS
        ========================= */


        ul {

            list-style: none;

            padding: 0;

            margin: 18px 0 0;

        }


        li {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 12px;

            margin-bottom: 9px;

            background: #f2f2f2;

            border-radius: 10px;

        }


        li span {

            flex: 1;

        }


        .completed span {

            text-decoration:
                line-through;

            opacity: 0.5;

        }


        .delete {

            background: #ddd;

        }


        /* =========================
           WEEK
        ========================= */


        .day {

            padding: 12px 0;

            border-bottom:
                1px solid #eee;

        }


        .day:last-child {

            border-bottom: none;

        }


        .day-title {

            display: flex;

            justify-content:
                space-between;

            font-weight: bold;

            margin-bottom: 6px;

        }


        .week-total {

            text-align: center;

            margin-top: 15px;

            font-size: 18px;

            font-weight: bold;

        }


        /* =========================
           SUBJECT SETTINGS
        ========================= */


        .subject-settings {

            display: flex;

            gap: 8px;

            margin-top: 12px;

        }


        .small-button {

            background: #ddd;

        }


        /* =========================
           ONLINE PLACEHOLDER
        ========================= */


        .online-button {

            width: 100%;

            margin-top: 5px;

            background: #222;

            color: white;

            padding: 14px;

        }


        .coming-soon {

            text-align: center;

            font-size: 13px;

            opacity: 0.5;

            margin-top: 8px;

        }


        /* =========================
           MOBILE
        ========================= */


        @media (max-width: 400px) {

            #timer {

                font-size: 40px;

            }


            .input-area {

                flex-direction: column;

            }


            .add {

                width: 100%;

            }


            .subject-settings {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Nisse Study
    </h1>


    <!-- =========================
         STUDY TIMER
    ========================= -->


    <div class="card timer">


        <div class="timer-title">
            Study Timer
        </div>


        <div
            id="timerStatus"
            class="timer-status"
        >
            Ready
        </div>


        <select
            id="subjectSelect"
        ></select>


        <div id="timer">
            00:00:00
        </div>


        <div class="buttons">


            <button
                id="startButton"
                class="start"
                onclick="startTimer()"
            >
                Start
            </button>


            <button
                class="reset"
                onclick="resetTimer()"
            >
                Reset
            </button>


        </div>


    </div>



    <!-- =========================
         TODAY
    ========================= -->


    <div class="card">


        <h2>
            Today
        </h2>


        <div class="stats">


            <div class="stat">

                <div class="stat-title">
                    Total Study
                </div>

                <div
                    class="stat-value"
                    id="todayTime"
                >
                    0m
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Tasks Done
                </div>

                <div
                    class="stat-value"
                    id="tasksDone"
                >
                    0
                </div>

            </div>


        </div>


    </div>



    <!-- =========================
         TODAY SUBJECTS
    ========================= -->


    <div class="card">


        <h2>
            Today's Subjects
        </h2>


        <div
            id="todaySubjects"
        ></div>


    </div>



    <!-- =========================
         TASKS
    ========================= -->


    <div class="card">


        <h2>
            Tasks
        </h2>


        <div class="input-area">


            <input
                id="taskInput"
                type="text"
                placeholder="Write a task..."
            >


            <button
                class="add"
                onclick="addTask()"
            >
                Add
            </button>


        </div>


        <ul
            id="taskList"
        ></ul>


    </div>



    <!-- =========================
         SUBJECTS
    ========================= -->


    <div class="card">


        <h2>
            Subjects
        </h2>


        <div class="input-area">


            <input
                id="subjectInput"
                type="text"
                placeholder="Add a subject..."
            >


            <button
                class="add"
                onclick="addSubject()"
            >
                Add
            </button>


        </div>


        <div class="subject-settings">


            <button
                class="small-button"
                onclick="removeSelectedSubject()"
            >
                Remove Selected Subject
            </button>


        </div>


    </div>



    <!-- =========================
         WEEK
    ========================= -->


    <div class="card">


        <h2>
            This Week
        </h2>


        <div
            id="weekStats"
        ></div>


        <div class="week-total">

            Total:

            <span
                id="weekTotal"
            >
                0m
            </span>

        </div>


    </div>



    <!-- =========================
         ONLINE
    ========================= -->


    <div class="card">


        <h2>
            Online Study Room
        </h2>


        <button
            class="online-button"
            onclick="onlineComingSoon()"
        >
            Enter Online Room
        </button>


        <div class="coming-soon">
            Coming soon
        </div>


    </div>


</div>



<script>


/* =====================================================
   DATA
===================================================== */


let tasks =
    JSON.parse(
        localStorage.getItem(
            "nisseTasks"
        )
    ) || [];


let subjects =
    JSON.parse(
        localStorage.getItem(
            "nisseSubjects"
        )
    ) || [

        "Math",

        "Physics",

        "Chemistry",

        "English"

    ];


let rawStudy =
    JSON.parse(
        localStorage.getItem(
            "nisseStudy"
        )
    ) || {};


let studyData =
    migrateStudyData(
        rawStudy
    );


/* =====================================================
   TIMER STATE
===================================================== */


/*
    timerSeconds:
    The number shown on screen.

    savedTimerSeconds:
    How much of the current timer
    has already been added to Study Time.

    timerRunning:
    Whether the timer is currently running.

    timerStartedAt:
    Timestamp used to survive page reloads.
*/


let timerSeconds = 0;

let savedTimerSeconds = 0;

let timerRunning = false;

let timerInterval = null;

let timerStartedAt = null;


/* =====================================================
   TIMER STORAGE KEY
===================================================== */


const TIMER_STORAGE_KEY =
    "nisseTimerState";


/* =====================================================
   STUDY DATA
===================================================== */


function migrateStudyData(data) {


    let result = {};


    Object.keys(data).forEach(
        function(date) {


            if (
                typeof data[date]
                === "number"
            ) {


                result[date] = {

                    total:
                        data[date],

                    subjects: {

                        "Other":
                            data[date]

                    }

                };


            } else {


                result[date] =
                    data[date];


                if (
                    !result[date].total
                ) {

                    result[date].total =
                        0;

                }


                if (
                    !result[date].subjects
                ) {

                    result[date].subjects =
                        {};

                }

            }

        }
    );


    return result;

}


function saveStudyData() {


    localStorage.setItem(

        "nisseStudy",

        JSON.stringify(
            studyData
        )

    );

}


function saveSubjects() {


    localStorage.setItem(

        "nisseSubjects",

        JSON.stringify(
            subjects
        )

    );

}


/* =====================================================
   TIMER STORAGE
===================================================== */


function saveTimerState() {


    let state = {


        timerSeconds:
            timerSeconds,


        savedTimerSeconds:
            savedTimerSeconds,


        timerRunning:
            timerRunning,


        timerStartedAt:
            timerStartedAt

    };


    localStorage.setItem(

        TIMER_STORAGE_KEY,

        JSON.stringify(
            state
        )

    );

}


function clearTimerState() {


    localStorage.removeItem(

        TIMER_STORAGE_KEY

    );

}


/* =====================================================
   RESTORE TIMER AFTER RELOAD
===================================================== */


function restoreTimer() {


    let saved =

        JSON.parse(

            localStorage.getItem(

                TIMER_STORAGE_KEY

            )

        );


    if (!saved) {

        timerSeconds = 0;

        savedTimerSeconds = 0;

        timerRunning = false;

        timerStartedAt = null;

        updateTimer();

        updateTimerButton();

        return;

    }


    timerSeconds =
        saved.timerSeconds || 0;


    savedTimerSeconds =
        saved.savedTimerSeconds || 0;


    timerRunning =
        saved.timerRunning || false;


    timerStartedAt =
        saved.timerStartedAt || null;


    /*
        If the timer was running when
        the page was reloaded, calculate
        the missing time.
    */


    if (
        timerRunning &&
        timerStartedAt
    ) {


        let now =
            Date.now();


        let elapsed =

            Math.floor(

                (
                    now -
                    timerStartedAt
                ) / 1000

            );


        if (elapsed > 0) {

            timerSeconds +=
                elapsed;

        }


        /*
            Start a fresh timestamp so
            future seconds are calculated
            correctly.
        */


        timerStartedAt =
            Date.now();


        timerInterval =
            setInterval(

                function() {

                    timerSeconds++;

                    updateTimer();

                    saveTimerState();

                },

                1000

            );


        updateTimerStatus(
            "Studying"
        );


    } else {


        timerRunning =
            false;


        updateTimerStatus(
            "Paused"
        );

    }


    updateTimer();

    updateTimerButton();

}


/* =====================================================
   START TIMER
===================================================== */


function startTimer() {


    /*
        If already running,
        do absolutely nothing.
    */


    if (timerRunning) {

        return;

    }


    let subject =
        getSelectedSubject();


    if (!subject) {


        alert(
            "Please select a subject."
        );


        return;

    }


    timerRunning = true;


    timerStartedAt =
        Date.now();


    updateTimerButton();

    updateTimerStatus(
        "Studying"
    );


    timerInterval =

        setInterval(

            function() {


                timerSeconds++;


                updateTimer();


                saveTimerState();


            },

            1000

        );


    saveTimerState();

}


/* =====================================================
   STOP TIMER
===================================================== */


function stopTimer() {


    if (!timerRunning) {

        return;

    }


    /*
        Stop the interval.
    */


    clearInterval(
        timerInterval
    );


    timerInterval = null;


    /*
        Save only the new part
        that hasn't been saved yet.
    */


    saveStudyTime();


    timerRunning = false;


    timerStartedAt = null;


    updateTimerButton();


    updateTimerStatus(
        "Paused"
    );


    saveTimerState();

}


/* =====================================================
   RESET TIMER
===================================================== */


function resetTimer() {


    /*
        Reset does NOT touch
        Study Time.
    */


    if (timerRunning) {


        clearInterval(
            timerInterval
        );


        timerInterval = null;


        timerRunning = false;


    }


    /*
        The current unsaved part is
        intentionally discarded.
    */


    timerSeconds = 0;


    savedTimerSeconds = 0;


    timerStartedAt = null;


    clearTimerState();


    updateTimer();


    updateTimerButton();


    updateTimerStatus(
        "Ready"
    );

}


/* =====================================================
   TIMER BUTTON
===================================================== */


function updateTimerButton() {


    let button =

        document.getElementById(
            "startButton"
        );


    if (timerRunning) {


        button.textContent =
            "Stop";


        button.onclick =
            stopTimer;


    } else {


        button.textContent =
            "Start";


        button.onclick =
            startTimer;

    }

}


/* =====================================================
   TIMER STATUS
===================================================== */


function updateTimerStatus(
    text
) {


    document.getElementById(

        "timerStatus"

    ).textContent = text;

}


/* =====================================================
   TIMER DISPLAY
===================================================== */


function updateTimer() {


    let hours =

        Math.floor(

            timerSeconds / 3600

        );


    let minutes =

        Math.floor(

            (
                timerSeconds % 3600
            ) / 60

        );


    let seconds =

        timerSeconds % 60;


    document.getElementById(

        "timer"

    ).textContent =

        formatNumber(hours) +

        ":" +

        formatNumber(minutes) +

        ":" +

        formatNumber(seconds);

}


function formatNumber(
    number
) {


    return number < 10

        ? "0" + number

        : number;

}


/* =====================================================
   SAVE STUDY TIME
===================================================== */


function saveStudyTime() {


    /*
        Only save the amount that has
        NOT already been saved.

        Example:

        Timer = 25:30
        Saved = 00:00

        Save = 25:30

        Then:

        Timer = 40:10
        Saved = 25:30

        Save = 14:40
    */


    let unsavedSeconds =

        timerSeconds -
        savedTimerSeconds;


    if (
        unsavedSeconds <= 0
    ) {

        return;

    }


    let today =
        getDateKey();


    let subject =
        getSelectedSubject();


    if (!subject) {

        return;

    }


    if (!studyData[today]) {


        studyData[today] = {

            total: 0,

            subjects: {}

        };

    }


    if (
        !studyData[today].subjects
    ) {

        studyData[today].subjects =
            {};

    }


    if (
        !studyData[today]
            .subjects[subject]
    ) {

        studyData[today]
            .subjects[subject] =
            0;

    }


    studyData[today].total +=
        unsavedSeconds;


    studyData[today]
        .subjects[subject] +=
        unsavedSeconds;


    /*
        Mark the current timer amount
        as already saved.
    */


    savedTimerSeconds =
        timerSeconds;


    saveStudyData();


    updateStats();


    saveTimerState();

}


/* =====================================================
   SUBJECTS
===================================================== */


function getSelectedSubject() {


    return document.getElementById(

        "subjectSelect"

    ).value;

}


function renderSubjects() {


    let select =

        document.getElementById(

            "subjectSelect"

        );


    let previousValue =
        select.value;


    select.innerHTML = "";


    subjects.forEach(

        function(subject) {


            let option =

                document.createElement(
                    "option"
                );


            option.value =
                subject;


            option.textContent =
                subject;


            select.appendChild(
                option
            );

        }

    );


    /*
        Keep the previously selected
        subject when possible.
    */


    if (
        subjects.includes(
            previousValue
        )
    ) {

        select.value =
            previousValue;

    }

}


/* =====================================================
   ADD SUBJECT
===================================================== */


function addSubject() {


    let input =

        document.getElementById(

            "subjectInput"

        );


    let name =
        input.value.trim();


    if (name === "") {

        return;

    }


    if (
        subjects.includes(name)
    ) {


        alert(
            "This subject already exists."
        );


        return;

    }


    subjects.push(name);


    saveSubjects();


    renderSubjects();


    input.value = "";

}


/* =====================================================
   REMOVE SUBJECT
===================================================== */


function removeSelectedSubject() {


    let selected =
        getSelectedSubject();


    if (!selected) {

        return;

    }


    if (
        subjects.length <= 1
    ) {


        alert(
            "You need at least one subject."
        );


        return;

    }


    subjects =

        subjects.filter(

            function(subject) {

                return subject !==
                    selected;

            }

        );


    saveSubjects();


    renderSubjects();

}


/* =====================================================
   TASKS
===================================================== */


function addTask() {


    let input =

        document.getElementById(

            "taskInput"

        );


    let text =
        input.value.trim();


    if (text === "") {

        return;

    }


    tasks.push({

        text: text,

        completed: false

    });


    input.value = "";


    saveTasks();


    renderTasks();


    updateStats();

}


/* =====================================================
   SAVE TASKS
===================================================== */


function saveTasks() {


    localStorage.setItem(

        "nisseTasks",

        JSON.stringify(
            tasks
        )

    );

}


/* =====================================================
   RENDER TASKS
===================================================== */


function renderTasks() {


    let list =

        document.getElementById(

            "taskList"

        );


    list.innerHTML = "";


    tasks.forEach(

        function(task, index) {


            let li =

                document.createElement(
                    "li"
                );


            if (task.completed) {

                li.classList.add(
                    "completed"
                );

            }


            let checkbox =

                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.checked =
                task.completed;


            checkbox.addEventListener(

                "change",

                function() {


                    tasks[index]
                        .completed =
                        checkbox.checked;


                    saveTasks();


                    renderTasks();


                    updateStats();

                }

            );


            let span =

                document.createElement(
                    "span"
                );


            span.textContent =
                task.text;


            let deleteButton =

                document.createElement(
                    "button"
                );


            deleteButton.textContent =
                "Delete";


            deleteButton.classList.add(
                "delete"
            );


            deleteButton.onclick =

                function() {


                    tasks.splice(
                        index,
                        1
                    );


                    saveTasks();


                    renderTasks();


                    updateStats();

                };


            li.appendChild(
                checkbox
            );


            li.appendChild(
                span
            );


            li.appendChild(
                deleteButton
            );


            list.appendChild(
                li
            );

        }

    );

}


/* =====================================================
   DATES
===================================================== */


function getDateKey(
    date = new Date()
) {


    let year =
        date.getFullYear();


    let month =

        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    let day =

        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return (

        year +
        "-" +
        month +
        "-" +
        day

    );

}


/* =====================================================
   FORMAT STUDY TIME
===================================================== */


function formatStudyTime(
    seconds
) {


    let hours =

        Math.floor(
            seconds / 3600
        );


    let minutes =

        Math.floor(

            (
                seconds % 3600
            ) / 60

        );


    if (hours > 0) {


        return (

            hours +
            "h " +
            minutes +
            "m"

        );

    }


    return minutes + "m";

}


/* =====================================================
   TODAY
===================================================== */


function updateStats() {


    let today =
        getDateKey();


    let todayData =

        studyData[today] || {

            total: 0,

            subjects: {}

        };


    document.getElementById(

        "todayTime"

    ).textContent =

        formatStudyTime(

            todayData.total

        );


    let completed =

        tasks.filter(

            function(task) {

                return task.completed;

            }

        ).length;


    document.getElementById(

        "tasksDone"

    ).textContent =
        completed;


    updateTodaySubjects();


    updateWeek();

}


/* =====================================================
   TODAY SUBJECTS
===================================================== */


function updateTodaySubjects() {


    let container =

        document.getElementById(

            "todaySubjects"

        );


    container.innerHTML = "";


    let today =
        getDateKey();


    let data =
        studyData[today];


    if (
        !data ||
        !data.subjects
    ) {


        container.textContent =
            "No study time yet.";


        return;

    }


    let hasStudy = false;


    subjects.forEach(

        function(subject) {


            let seconds =

                data.subjects[
                    subject
                ] || 0;


            if (seconds > 0) {


                hasStudy = true;


                let row =

                    document.createElement(
                        "div"
                    );


                row.classList.add(
                    "study-row"
                );


                let name =

                    document.createElement(
                        "span"
                    );


                name.textContent =
                    subject;


                let time =

                    document.createElement(
                        "span"
                    );


                time.textContent =

                    formatStudyTime(
                        seconds
                    );


                row.appendChild(
                    name
                );


                row.appendChild(
                    time
                );


                container.appendChild(
                    row
                );

            }

        }

    );


    if (
        data.subjects["Other"]
    ) {


        hasStudy = true;


        let row =

            document.createElement(
                "div"
            );


        row.classList.add(
            "study-row"
        );


        let name =

            document.createElement(
                "span"
            );


        name.textContent =
            "Other";


        let time =

            document.createElement(
                "span"
            );


        time.textContent =

            formatStudyTime(

                data.subjects[
                    "Other"
                ]

            );


        row.appendChild(
            name
        );


        row.appendChild(
            time
        );


        container.appendChild(
            row
        );

    }


    if (!hasStudy) {


        container.textContent =
            "No study time yet.";

    }

}


/* =====================================================
   WEEK
===================================================== */


function updateWeek() {


    let container =

        document.getElementById(

            "weekStats"

        );


    container.innerHTML = "";


    let today =
        new Date();


    let dayOfWeek =
        today.getDay();


    let mondayOffset =

        dayOfWeek === 0

            ? -6

            : 1 - dayOfWeek;


    let dayNames = [

        "Monday",

        "Tuesday",

        "Wednesday",

        "Thursday",

        "Friday",

        "Saturday",

        "Sunday"

    ];


    let total = 0;


    for (
        let i = 0;
        i < 7;
        i++
    ) {


        let date =
            new Date(today);


        date.setDate(

            today.getDate() +

            mondayOffset +

            i

        );


        let key =
            getDateKey(date);


        let data =

            studyData[key] || {

                total: 0,

                subjects: {}

            };


        total +=
            data.total;


        let day =

            document.createElement(
                "div"
            );


        day.classList.add(
            "day"
        );


        let title =

            document.createElement(
                "div"
            );


        title.classList.add(
            "day-title"
        );


        let name =

            document.createElement(
                "span"
            );


        name.textContent =
            dayNames[i];


        let totalTime =

            document.createElement(
                "span"
            );


        totalTime.textContent =

            formatStudyTime(
                data.total
            );


        title.appendChild(
            name
        );


        title.appendChild(
            totalTime
        );


        day.appendChild(
            title
        );


        if (data.subjects) {


            Object.keys(
                data.subjects
            ).forEach(

                function(subject) {


                    let seconds =

                        data.subjects[
                            subject
                        ];


                    if (
                        seconds > 0
                    ) {


                        let row =

                            document.createElement(
                                "div"
                            );


                        row.classList.add(
                            "study-row"
                        );


                        let subjectName =

                            document.createElement(
                                "span"
                            );


                        subjectName.textContent =
                            subject;


                        let time =

                            document.createElement(
                                "span"
                            );


                        time.textContent =

                            formatStudyTime(
                                seconds
                            );


                        row.appendChild(
                            subjectName
                        );


                        row.appendChild(
                            time
                        );


                        day.appendChild(
                            row
                        );

                    }

                }

            );

        }


        container.appendChild(
            day
        );

    }


    document.getElementById(

        "weekTotal"

    ).textContent =

        formatStudyTime(
            total
        );

}
